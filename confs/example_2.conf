server {
	listen 127.0.0.1:5050;

	root www/html/;

	#error_page 400 /errors/404.html;
}

server {
	listen 127.0.0.1:8080;
	listen 127.0.0.1:4242;
	listen 192.168.1.68:1025;
	#listen 443; #REQUIRE ROOT PRIVELEGIES
	listen *:2222;
	listen localhost:6060;
	#listen unix:/var/run/some.sock;

	server_name myserver.local;

	#relative path
	root www/html/;
	autoindex on;
	#index index.html ../../www/html/index.html;

	client_max_body_size 10Mb;

	error_page 400 /errors/400.html;
	#error_page 404 /errors/404.html;
	#error_page 500 /errors/500.html;
	#error_page 502 /errors/502.html;

	#return 300 http://$server_name:443;
	#return 300 "this is a text";

	# Default route
	location / {
		#try_files $uri $uri/ =404;
		autoindex on;
		index index.html;
		allowed_methods GET;
	}

	location /testers {
		return 300 http://github.com/;
		root www/;
		autoindex on;
	}

	# CGI folder
	location /cgi-bin/ {

		#absolute path
		root www/;

		cgi_extension .py /usr/bin/python3;
		cgi_extension .pl /usr/bin/perl;
		cgi_extension .php /usr/bin/php;
	}

	# File upload example
	location /upload {
		allowed_methods POST;
		upload_store uploads;
	}

	# DELETE example
	location /delete {
		allowed_methods DELETE;
		root www/uploads;
	}

	location /images {
		root www/;
		autoindex on;
	}

}

