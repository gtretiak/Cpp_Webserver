server {
	listen 127.0.0.1:5050;


	root www/;

	#error_page 404 /errors/404.html;
}

server {
	listen *:8081;
	listen 127.0.0.1:4243;
	#listen 127.0.0.1:5050;
	listen 192.168.122.1;
	listen localhost:6060;
	
	upload_store uploads;

	#relative path
	root www/;
	autoindex off;
	index html/index.html;

	client_max_body_size 8b;

	#return 302 https://www.google.com;

	error_page 400 /errors/400.html;
	#error_page 404 /errors/404.html;
	error_page 500 /errors/500.html;
	error_page 502 /errors/502.html;

	# CGI for Python and perl
	location /cgi-bin/ {

		root www/;

		cgi_extension .py /usr/bin/python3;
		cgi_extension .pl /usr/bin/perl;
	}

	# File upload example
	location /uploads {
		allowed_methods POST DELETE GET;
		upload_store uploads;
	}

	# DELETE example
	location /delete {
		allowed_methods DELETE;
		index /html/cgi_nav.html;
		root www/;
	}

	location /html {
		root www/;
	}
} 

