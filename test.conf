server {
    listen 8080;

    location / {
        root ./www/html;
        allowed_methods GET;
	index	index.html;
    }

    location /post_body {
        allowed_methods POST;
        client_max_body_size 100mb;
    }

    location /directory {
        root ./YoupiBanane;
        allowed_methods GET;
        index youpi.bad_extension;
    }

    location *.bla {
        allowed_methods POST;
        cgi ./cgi_test;
    }
}
