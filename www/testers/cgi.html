<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CGI test</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>CGI test</h1>
<p><a href="/html/index.html">&larr; back to home</a></p>

<p>Quick-fill one of the sample scripts in <code>www/cgi-bin/</code>
(each one is built to trigger a specific branch of
<code>classifyCgiResponse</code>):</p>
<p>
<button onclick="fill('/cgi-bin/echo.py')">echo.py (CGI_DOCUMENT)</button>
<button onclick="fill('/cgi-bin/local_redirect_to_static.py')">local redirect &rarr; static</button>
<button onclick="fill('/cgi-bin/local_redirect_chain1.py')">local redirect chain (CGI&rarr;CGI&rarr;CGI)</button>
<button onclick="fill('/cgi-bin/client_redirect.py')">client redirect</button>
<button onclick="fill('/cgi-bin/client_redirect_with_document.py')">client redirect + document</button>
</p>

<div class="field">
  <label>CGI script path:</label>
  <input type="text" id="cgiPath" value="/cgi-bin/echo.py">
</div>
<div class="field">
  <label>Method:</label>
  <select id="cgiMethod">
    <option value="GET">GET</option>
    <option value="POST">POST</option>
  </select>
</div>
<div class="field">
  <label>Query string (no leading ?):</label>
  <input type="text" id="cgiQuery" value="name=rache&amp;project=webserv">
</div>
<div class="field">
  <label>Body (used only for POST):</label><br>
  <textarea id="cgiBody" rows="4">hello=world</textarea>
</div>

<button onclick="runCgi()">Execute</button>

<h3>Raw response</h3>
<pre id="cgiOutput">(nothing yet)</pre>

<script>
function fill(path) {
  document.getElementById('cgiPath').value = path;
}

async function runCgi() {
  const path = document.getElementById('cgiPath').value.trim();
  const method = document.getElementById('cgiMethod').value;
  const query = document.getElementById('cgiQuery').value.trim();
  const body = document.getElementById('cgiBody').value;
  const out = document.getElementById('cgiOutput');

  if (!path) { out.textContent = 'Type a CGI path first.'; return; }

  let url = path;
  if (query) url += '?' + query;

  const opts = { method: method };
  if (method === 'POST') {
    opts.body = body;
    opts.headers = { 'Content-Type': 'text/plain' };
  }

  out.textContent = 'Running ' + method + ' ' + url + ' ...';

  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    let headers = '';
    res.headers.forEach((v, k) => { headers += k + ': ' + v + '\n'; });
    out.textContent =
      'Status: ' + res.status + ' ' + res.statusText + '\n\n' +
      headers + '\n' +
      'Body:\n' + text;
  } catch (err) {
    out.textContent = 'Request failed: ' + err;
  }
}
</script>
</body>
</html>
