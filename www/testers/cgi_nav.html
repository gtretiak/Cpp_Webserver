<!-- index_nav.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CGI Test Index Navigation</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>body{font-family:Arial,Helvetica,sans-serif;padding:20px}</style>
</head>
<body>
  <h1>CGI Test Index Navigation</h1>
  <p>Click the button to navigate to the CGI script. The CGI output will replace this page.</p>

  <!-- Edit this value to point to your CGI endpoint -->
  <input id="cgiPath" type="text" value="/cgi-bin/perl_script.pl" style="width:60%;padding:.25rem;margin-right:.5rem">
  <button id="runCgi">Open CGI as Page</button>

  <script>
	document.getElementById('runCgi').addEventListener('click', function () {
	  const path = document.getElementById('cgiPath').value.trim() || '/cgi-bin/hello.cgi';
	  // Use location.href to navigate and let the browser render the CGI output as a full page
	  window.location.href = path;
	});
  </script>
</body>
</html>
