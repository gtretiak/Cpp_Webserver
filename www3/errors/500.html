<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: linear-gradient(135deg, #4c63d2 0%, #bc1888 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            display: flex;
            overflow: hidden;
        }
        
        .left-section {
            flex: 1;
            background: linear-gradient(135deg, #4c63d2 0%, #bc1888 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            padding: 40px 20px;
        }
        
        .emoji {
            font-size: 140px;
            animation: glitch 0.3s infinite, bounce 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        }
        
        @keyframes glitch {
            0% {
                text-shadow: -2px 0 #ff006e, 2px 0 #00ff41;
            }
            50% {
                text-shadow: 2px 0 #ff006e, -2px 0 #00ff41;
            }
            100% {
                text-shadow: -2px 0 #ff006e, 2px 0 #00ff41;
            }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(5deg); }
        }
        
        .right-section {
            flex: 1;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .error-code {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(45deg, #4c63d2, #bc1888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .error-title {
            font-size: 32px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .error-description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        
        .suggestions {
            background: #f0ebf8;
            border-left: 4px solid #bc1888;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        
        .suggestions h4 {
            font-size: 12px;
            text-transform: uppercase;
            color: #bc1888;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .suggestions-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .suggestion-item {
            font-size: 14px;
            color: #555;
            display: flex;
            align-items: center;
        }
        
        .suggestion-item:before {
            content: "✓";
            color: #bc1888;
            font-weight: bold;
            margin-right: 8px;
            font-size: 16px;
        }
        
        .button-group {
            display: flex;
            gap: 12px;
        }
        
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4c63d2, #bc1888);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(188, 24, 136, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            border-color: #bbb;
        }
        
        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            font-family: 'Courier New', monospace;
        }
        
        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .left-section { min-height: 250px; padding: 30px 20px; }
            .emoji { font-size: 100px; }
            .right-section { padding: 40px 25px; }
            .error-code { font-size: 48px; }
            .error-title { font-size: 24px; }
            .suggestions-list { flex-direction: column; gap: 8px; }
            .button-group { flex-direction: column; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <div class="emoji">💥</div>
        </div>
        
        <div class="right-section">
            <div class="error-code">500</div>
            <h1 class="error-title">Internal Server Error</h1>
            
            <p class="error-description">
                Sorry, we're experiencing technical difficulties. Our team is working to fix this. Please try again later.
            </p>
            
            <div class="suggestions">
                <h4>What we're doing:</h4>
                <div class="suggestions-list">
                    <span class="suggestion-item">Investigating issue</span>
                    <span class="suggestion-item">Working on fix</span>
                    <span class="suggestion-item">Coming back soon</span>
                </div>
            </div>
            
            <div class="button-group">
                <a href="./../index.html" class="btn btn-primary">Go Home</a>
                <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
            </div>
            
            <div class="timestamp" id="timestamp">Error ID: 500 | Time: 00:00 00/00/0000</div>
        </div>
    </div>
    
    <script>
        function updateTimestamp(code) {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const year = now.getFullYear();
            
            const timestamp = `${hours}:${minutes} ${day}/${month}/${year}`;
            document.getElementById('timestamp').textContent = `Error ID: ${code} | Time: ${timestamp}`;
        }
        updateTimestamp(500);
    </script>
</body>
</html>
